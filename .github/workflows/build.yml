name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv tool install ruff
      - name: Lint
        run: ruff check concept_benchmark/ tests/ experiments/ scripts/ examples/
      - name: Format check
        run: ruff format --check concept_benchmark/ tests/ experiments/ scripts/ examples/

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MODULE_NAME: concept_benchmark
      PYTHONWARNINGS: error
      OMP_NUM_THREADS: "2"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.11 has bugs: meson
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install pycairo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config libmagickwand-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-local-path: "~/.local"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project (dev deps)
        run: uv sync --locked --all-extras --dev

      - name: Patch pero invalid escape sequences (upstream bug; a SyntaxError under PYTHONWARNINGS=error on 3.12+)
        env:
          PYTHONWARNINGS: default
        run: |
          PERO_DIR=$(uv run python -c "import pero, os; print(os.path.dirname(pero.__file__))")
          find "$PERO_DIR" -name '*.py' -exec sed -i 's/re\.compile("/re.compile(r"/g' {} +

      - name: Run tests
        run: >
          uv run pytest -q -ra -n auto
          --maxfail=1
          --durations=20
          --junitxml=./test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results/pytest.xml

  wheel:
    # The package as pip users get it: the built wheel, no extras, run from an empty directory.
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            extras: ""
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "[explore]"
          - os: windows-latest
            python-version: "3.12"
            extras: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install cairo (pycairo builds from source on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: uv build --wheel
      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv wheel-env
          PY=$(ls ./wheel-env/bin/python 2>/dev/null || ls ./wheel-env/Scripts/python.exe)
          echo "PY=$PY" >> "$GITHUB_ENV"
          WHEEL=$(ls dist/*.whl)
          $PY -m pip install "$WHEEL${{ matrix.extras }}" pytest pytest-xdist scikit-learn
      - name: Import, version, examples and the documented data API
        shell: bash
        env:
          CONCEPT_BENCHMARK_DATA_DIR: ${{ github.workspace }}/wheel-data
        run: |
          PY=../$PY
          mkdir -p empty && cd empty
          $PY -c "import concept_benchmark as c, pathlib; print(c.__version__, c.__file__); assert 'site-packages' in c.__file__"
          $PY ../examples/robot_quickstart.py
          $PY ../examples/sudoku_quickstart.py
          $PY -m pytest -q -n auto --import-mode=importlib ../tests/test_pip_tier.py \
            ../tests/test_benchmark_metrics.py ../tests/test_benchmark_plots.py \
            ../tests/test_concept_dataset.py ../tests/test_concept_dataset_sample.py \
            ../tests/test_concept_image_dataset_sample.py ../tests/test_config.py \
            ../tests/test_generators.py ../tests/test_label_rules.py ../tests/test_ocr_training.py \
            ../tests/test_robot_hierarchy.py ../tests/test_selective_thresholds.py \
            ../tests/test_to_dataframe_explore.py ../tests/test_transforms.py ../tests/test_utils.py
