[project]
name = "concept-benchmark"
version = "0.0.1"
description = "Concept Benchmark"
authors = [
    { name = "Berk Ustun"},
    { name =  "Ryan Hammonds" },
    { name = "Harry Cheon"}
]

# use python 3.12
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "dill",
    "matplotlib",
    "psutil",
    "torch>=2.7.1",
    "gitpython>=3.1.45",
    "pyarrow>=21.0.0",
    "fastparquet>=2024.11.0",
    "mlcroissant[parquet]>=1.0.21",
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "skorch>=1.2.0",
    "torcheval>=0.0.7",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
    "rich"
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
  { index = "pytorch-metal" },
]
torchvision = [
  { index = "pytorch-metal" },
]
torchaudio = [
  { index = "pytorch-metal" }
]

[[tool.uv.index]]
name = "pytorch-metal"
url = "https://download.pytorch.org/whl/nightly/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
