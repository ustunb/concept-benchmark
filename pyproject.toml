[project]
name = "concept-benchmark"
version = "0.0.1"
description = "Concept Benchmark"
authors = [
    { name = "Berk Ustun"},
    { name =  "Ryan Hammonds" },
    { name = "Harry Cheon"},
    { name = "Shreyas Kadekodi"},
]

requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "dill",
    "matplotlib",
    "psutil",
    "torch>=2.7.1",
    "gitpython>=3.1.45",
    "pyarrow>=21.0.0",
    "fastparquet>=2024.11.0",
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "skorch>=1.2.0",
    "torcheval>=0.0.7",
    "torchvision>=0.23.0",
    "albumentations",
    "colorir>=2.0.0",
    "pero>=0.18.0",
    "Pillow>=9.5.0",
    "pycairo>=1.24.0",
    "transformers>=4.55.2"
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
    "rich"
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
