[project]
name = "concept-benchmark"
version = "0.1.5"
description = "Synthetic benchmarks for evaluating Concept Bottleneck Models."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Julian Skirzynski" },
    { name = "Harry Cheon" },
    { name = "Shreyas Kadekodi" },
    { name = "Meredith Stewart" },
    { name = "Berk Ustun" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.10"

dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.1",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.3",
    "tqdm>=4.67.1",
    "dill>=0.3.8",
    "matplotlib>=3.10.3",
    "psutil>=7.0.0",
    "torch>=2.7.1",
    "pyarrow>=21.0.0",
    "fastparquet>=2024.11.0",
    "datasets>=4.0.0",
    "pillow>=10.0.0",
    "skorch>=1.2.0",
    "torcheval>=0.0.7",
    "torchvision>=0.23.0",
    "albumentations",
    "colorir>=2.0.0",
    "pero>=0.18.0",
    "pycairo>=1.28.0",
    "transformers>=4.55.2",
    "cvxpy>=1.4.0",
    "pyyaml>=6.0",
    "open-clip-torch>=2.20.0",
    "google-genai>=1.0.0",
]

[project.urls]
Repository = "https://github.com/ustunb/concept-benchmark"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "ipykernel",
    "rich",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["data/", "results/", "scripts/", ".claude/"]

[tool.hatch.build.targets.wheel]
packages = ["concept_benchmark"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",   # module-import-not-at-top (intentional lazy imports)
    "E501",   # line-too-long (research code, not worth reformatting)
    "E731",   # lambda-assignment (used in data pipelines)
    "E701",   # multiple-statements-on-one-line-colon
    "E702",   # multiple-statements-on-one-line-semicolon
    "F841",   # unused-variable (readability assignments in drawing/data code)
    "W291",   # trailing-whitespace
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sklearn.exceptions.UndefinedMetricWarning",
    "ignore::SyntaxWarning:pero",
]
testpaths = [
    "tests"
]
